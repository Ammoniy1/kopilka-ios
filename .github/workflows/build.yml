name: Сборка IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Генерация проекта
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Сборка
        run: |
          set -o pipefail
          xcodebuild -project Kopilka.xcodeproj -scheme Kopilka -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Kopilka.app

      - name: Подпись ad-hoc (чтобы AltStore увидел App Group) и упаковка
        run: |
          APP=build/Build/Products/Release-iphoneos/Kopilka.app
          codesign -f -s - --entitlements Widget/KopilkaWidget.entitlements "$APP/PlugIns/KopilkaWidget.appex"
          codesign -f -s - --entitlements App/Kopilka.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Kopilka.ipa Payload
          ls -lh Kopilka.ipa

      - name: Лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Копилка (сборка ${{ github.run_number }})
          files: Kopilka.ipa
          make_latest: true
