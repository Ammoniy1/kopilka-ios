name: Kopilka
options:
  bundleIdPrefix: com.kopilka
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Kopilka:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Копилка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.kopilka.app
            CFBundleURLSchemes: [kopilka]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/Kopilka.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kopilka.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopilka.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: KopilkaWidget
        embed: true
    scheme: {}
  KopilkaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/Assets.xcassets
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Копилка
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/KopilkaWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.kopilka.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kopilka.app.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
